name: Build and verify OpSec (Minecraft 1.21.11)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsec-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Minecraft 1.21.11 JAR
        run: ./gradlew --no-daemon :1.21.11:build

      - name: Verify JAR archive and required metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find versions/1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$jar_file"
          unzip -t "$jar_file"
          unzip -p "$jar_file" fabric.mod.json | grep -q '"id"[[:space:]]*:[[:space:]]*"opsec"'
          sha256sum "$jar_file" | tee SHA256SUMS.txt
          echo "Verified build: $jar_file"

      - name: Upload JAR and checksum
        uses: actions/upload-artifact@v4
        with:
          name: opsec-minecraft-1.21.11
          path: |
            versions/1.21.11/build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
